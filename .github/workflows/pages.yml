name: Deploy dashboard to GitHub Pages

on:
  # Auto-deploy whenever the dashboard or data changes on the default branch
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  # Allow manual trigger
  workflow_dispatch:

# GITHUB_TOKEN permissions required by actions/deploy-pages
permissions:
  contents: read
  pages: write
  id-token: write

# Only one in-flight deployment at a time
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Regenerate manifest
        # plot.py scans docs/data/ and writes manifest.json.
        # Only uses stdlib -- no pip install needed.
        run: python plot.py

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
